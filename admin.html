<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — BINet Funnel Digitals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .status-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .status-dot.active{ background:#1D9E75; }
  .status-dot.onboarding{ background:#D4A017; }
  .status-dot.paused{ background:#9AA1AC; }
  .client-item{ position:relative; }
  .unread-badge{
    position:absolute; top:12px; right:12px; background:#D64545; color:#fff;
    font-size:0.68rem; font-weight:700; padding:2px 7px; border-radius:999px;
  }
  .attach-btn{
    background:var(--off-white); border:1px solid #DDE1E7; border-radius:8px;
    padding:0 14px; cursor:pointer; font-size:1rem; color:var(--slate);
  }
  .attachment-chip{
    display:none; align-items:center; gap:8px; background:var(--off-white);
    border-radius:8px; padding:8px 12px; font-size:0.82rem; margin-top:8px; max-width:fit-content;
  }
  .attachment-chip button{ background:none; border:none; color:var(--slate); cursor:pointer; font-size:0.9rem; }
  .msg-attachment{ display:block; margin-top:6px; font-size:0.82rem; text-decoration:underline; }
  .home-feed-item{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid #EEF0F3; cursor:pointer; }
  .home-feed-item:last-child{ border-bottom:none; }
  .home-feed-item:hover{ background:var(--off-white); }
  .home-feed-item h4{ font-size:0.92rem; margin-bottom:2px; }
  .home-feed-item p{ font-size:0.85rem; color:var(--slate); }
</style>
<link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
</head>
<body class="dash-shell">

<div class="dash-topbar">
  <div class="wrap">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="BINet Funnel Digitals logo" style="height:32px;">
      <span>BINet Funnel Digitals — Admin</span>
    </a>
    <div class="dash-user">
      <span id="admin-label">Loading...</span>
      <button id="logout-btn" class="btn btn-outline">Log Out</button>
    </div>
  </div>
</div>

<div class="admin-layout">
  <div class="admin-sidebar">
    <button id="add-client-btn" class="btn btn-green" style="width:100%; justify-content:center; margin-bottom:14px;">+ Add New Client</button>
    <div id="add-client-form" style="display:none; background:var(--off-white); border-radius:10px; padding:14px; margin-bottom:16px;">
      <input type="text" id="new-business-name" placeholder="Business name" style="width:100%; margin-bottom:8px; padding:9px 10px; border-radius:6px; border:1px solid #DDE1E7; font-size:0.85rem;">
      <input type="text" id="new-contact-name" placeholder="Contact name" style="width:100%; margin-bottom:8px; padding:9px 10px; border-radius:6px; border:1px solid #DDE1E7; font-size:0.85rem;">
      <input type="tel" id="new-phone" placeholder="Phone" style="width:100%; margin-bottom:8px; padding:9px 10px; border-radius:6px; border:1px solid #DDE1E7; font-size:0.85rem;">
      <input type="email" id="new-email" placeholder="Email" style="width:100%; margin-bottom:8px; padding:9px 10px; border-radius:6px; border:1px solid #DDE1E7; font-size:0.85rem;">
      <input type="text" id="new-password" placeholder="Temporary password" style="width:100%; margin-bottom:10px; padding:9px 10px; border-radius:6px; border:1px solid #DDE1E7; font-size:0.85rem;">
      <button id="create-client-btn" class="btn btn-green" style="width:100%; justify-content:center;">Create Account</button>
    </div>
    <input type="text" id="client-search" class="client-search" placeholder="Search clients...">
    <div id="client-list">
      <p class="empty-state">Loading clients...</p>
    </div>
  </div>

  <div class="admin-content">
    <div class="admin-stats">
      <div class="stat-card">
        <div class="num" id="stat-clients">0</div>
        <div class="label">Total Clients</div>
      </div>
      <div class="stat-card">
        <div class="num" id="stat-open-requests">0</div>
        <div class="label">Open Requests</div>
      </div>
      <button id="broadcast-btn" class="btn btn-green" style="align-self:center;">📢 New Broadcast</button>
      <button id="analytics-btn" class="btn btn-outline" style="align-self:center; color:var(--navy); border-color:#DDE1E7;">📊 Analytics</button>
      <button id="home-btn" class="btn btn-outline" style="align-self:center; color:var(--navy); border-color:#DDE1E7;">🏠 Home</button>
    </div>

    <div id="client-panel">
      <p class="no-client-selected">Loading your dashboard...</p>
    </div>
  </div>
</div>

<script>
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let allClients = [];
  let selectedClient = null;
  let currentSession = null;
  let quill = null;
  let unreadCounts = {};

  function timeAgo(dateStr) {
    const diff = (Date.now() - new Date(dateStr)) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // ---- Auth check ----
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    const { data: profile, error } = await supabaseClient
      .from('profiles').select('*').eq('id', session.user.id).single();

    if (error || !profile || profile.role !== 'admin') { window.location.href = 'login.html'; return; }

    currentSession = session;
    document.getElementById('admin-label').textContent = profile.email;
    loadClients();
  })();

  document.getElementById('home-btn').addEventListener('click', () => {
    selectedClient = null;
    renderClientList(allClients);
    renderHomeFeed();
  });

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });

  // ---- Add client ----
  document.getElementById('add-client-btn').addEventListener('click', () => {
    const formEl = document.getElementById('add-client-form');
    formEl.style.display = formEl.style.display === 'none' ? 'block' : 'none';
  });

  document.getElementById('create-client-btn').addEventListener('click', async () => {
    const business_name = document.getElementById('new-business-name').value.trim();
    const contact_name = document.getElementById('new-contact-name').value.trim();
    const phone = document.getElementById('new-phone').value.trim();
    const email = document.getElementById('new-email').value.trim();
    const password = document.getElementById('new-password').value;
    const btn = document.getElementById('create-client-btn');

    if (!business_name || !email || !password) {
      alert('Please fill in at least business name, email, and password.');
      return;
    }

    btn.textContent = 'Creating...';

    const res = await fetch('/api/create-client', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + currentSession.access_token
      },
      body: JSON.stringify({ email, password, business_name, contact_name, phone })
    });

    const result = await res.json();
    btn.textContent = 'Create Account';

    if (!res.ok) {
      alert('Could not create client: ' + (result.error?.message || JSON.stringify(result.error)));
      return;
    }

    alert('Client created! Share these details with them:\n\nEmail: ' + email + '\nPassword: ' + password + '\nLogin at: ' + window.location.origin + '/login.html');

    document.getElementById('new-business-name').value = '';
    document.getElementById('new-contact-name').value = '';
    document.getElementById('new-phone').value = '';
    document.getElementById('new-email').value = '';
    document.getElementById('new-password').value = '';
    document.getElementById('add-client-form').style.display = 'none';

    loadClients();
  });

  // ---- Load client list ----
  async function loadClients() {
    const { data, error } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('role', 'client')
      .order('created_at', { ascending: false });

    if (error) { document.getElementById('client-list').innerHTML = '<p class="empty-state">Error loading clients.</p>'; return; }

    allClients = data || [];
    document.getElementById('stat-clients').textContent = allClients.length;
    await loadUnreadCounts();
    renderClientList(allClients);
    loadOpenRequestsCount();
    if (!selectedClient) renderHomeFeed();
  }

  async function loadUnreadCounts() {
    const { data } = await supabaseClient
      .from('messages')
      .select('client_id')
      .eq('sender_role', 'client')
      .eq('read_by_admin', false);

    unreadCounts = {};
    (data || []).forEach(m => {
      unreadCounts[m.client_id] = (unreadCounts[m.client_id] || 0) + 1;
    });
  }

  function renderClientList(clients) {
    const listEl = document.getElementById('client-list');
    if (clients.length === 0) {
      listEl.innerHTML = '<p class="empty-state">No clients yet.</p>';
      return;
    }
    listEl.innerHTML = clients.map(c => `
      <div class="client-item ${selectedClient && selectedClient.id === c.id ? 'active' : ''}" data-id="${c.id}">
        <h4><span class="status-dot ${c.status || 'active'}"></span>${escapeHtml(c.business_name || c.email)}</h4>
        <p>${escapeHtml(c.contact_name || c.email)}</p>
        ${unreadCounts[c.id] ? `<span class="unread-badge">${unreadCounts[c.id]}</span>` : ''}
      </div>
    `).join('');

    listEl.querySelectorAll('.client-item').forEach(item => {
      item.addEventListener('click', () => {
        const client = allClients.find(c => c.id === item.dataset.id);
        selectClient(client);
      });
    });
  }

  document.getElementById('client-search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = allClients.filter(c =>
      (c.business_name || '').toLowerCase().includes(q) ||
      (c.contact_name || '').toLowerCase().includes(q) ||
      (c.email || '').toLowerCase().includes(q)
    );
    renderClientList(filtered);
  });

  async function loadOpenRequestsCount() {
    const { count } = await supabaseClient
      .from('requests')
      .select('*', { count: 'exact', head: true })
      .eq('status', 'open');
    document.getElementById('stat-open-requests').textContent = count || 0;
  }

  // ---- Select a client ----
  function selectClient(client) {
    selectedClient = client;
    renderClientList(allClients);
    renderClientPanel();
  }

  function renderClientPanel() {
    const panel = document.getElementById('client-panel');
    panel.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px;">
        <div>
          <h1 style="font-size:1.5rem; margin-bottom:4px;">${escapeHtml(selectedClient.business_name || selectedClient.email)}</h1>
          <p class="sub" style="margin-bottom:0;">${escapeHtml(selectedClient.contact_name || '')} ${selectedClient.phone ? '· ' + escapeHtml(selectedClient.phone) : ''} · ${escapeHtml(selectedClient.email)}</p>
        </div>
        <select class="status-select" id="client-status-select">
          <option value="active" ${selectedClient.status === 'active' || !selectedClient.status ? 'selected' : ''}>Active</option>
          <option value="onboarding" ${selectedClient.status === 'onboarding' ? 'selected' : ''}>Onboarding</option>
          <option value="paused" ${selectedClient.status === 'paused' ? 'selected' : ''}>Paused</option>
        </select>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="messages">Messages</button>
        <button class="tab-btn" data-tab="reports">Reports</button>
        <button class="tab-btn" data-tab="requests">Requests</button>
        <button class="tab-btn" data-tab="notes">Notes</button>
      </div>

      <div class="tab-panel active" id="tab-messages">
        <div class="card-box">
          <div id="admin-message-thread" class="message-thread">
            <p class="empty-state">Loading...</p>
          </div>
          <form id="admin-message-form" class="message-input-row">
            <button type="button" class="attach-btn" id="admin-attach-btn" title="Attach a file">📎</button>
            <input type="file" id="admin-attach-input" style="display:none;">
            <input type="text" id="admin-message-input" placeholder="Reply to ${escapeHtml(selectedClient.business_name || selectedClient.email)}...">
            <button type="submit" class="btn btn-green">Send</button>
          </form>
          <div class="attachment-chip" id="admin-attachment-chip">
            <span id="admin-attachment-name"></span>
            <button type="button" id="admin-remove-attachment">✕</button>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="tab-reports">
        <div class="card-box">
          <div id="admin-reports-list"><p class="empty-state">Loading...</p></div>
          <div class="upload-row">
            <div class="field">
              <label>Report title</label>
              <input type="text" id="report-title" placeholder="e.g. July Performance Report">
            </div>
            <div class="field">
              <label>Period</label>
              <input type="text" id="report-period" placeholder="e.g. July 2026">
            </div>
            <div class="field">
              <label>File</label>
              <input type="file" id="report-file">
            </div>
            <button class="btn btn-green" id="upload-report-btn">Upload</button>
          </div>
        </div>
      </div>

      <div class="tab-panel" id="tab-requests">
        <div class="card-box">
          <div id="admin-requests-list"><p class="empty-state">Loading...</p></div>
        </div>
      </div>

      <div class="tab-panel" id="tab-notes">
        <div class="card-box">
          <p style="font-size:0.85rem; color:var(--slate); margin-bottom:14px;">Private notes — only visible to you, never shown to this client.</p>
          <textarea id="admin-note-textarea" rows="8" placeholder="e.g. Called 3rd Aug, interested in upgrading package..." style="width:100%; padding:12px 14px; border-radius:8px; border:1px solid #DDE1E7; background:var(--off-white); font-family:'Inter',sans-serif; font-size:0.92rem;"></textarea>
          <button id="save-note-btn" class="btn btn-green" style="margin-top:12px;">Save Note</button>
          <p id="note-save-msg" style="font-size:0.85rem; color:var(--slate); margin-top:8px;"></p>
        </div>
      </div>
    `;

    panel.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        panel.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        panel.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        panel.querySelector('#tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    document.getElementById('client-status-select').addEventListener('change', async (e) => {
      await supabaseClient.from('profiles').update({ status: e.target.value }).eq('id', selectedClient.id);
      selectedClient.status = e.target.value;
      const c = allClients.find(c => c.id === selectedClient.id);
      if (c) c.status = e.target.value;
      renderClientList(allClients);
    });

    document.getElementById('admin-message-form').addEventListener('submit', sendAdminMessage);
    document.getElementById('upload-report-btn').addEventListener('click', uploadReport);
    document.getElementById('save-note-btn').addEventListener('click', saveAdminNote);

    document.getElementById('admin-attach-btn').addEventListener('click', () => {
      document.getElementById('admin-attach-input').click();
    });
    document.getElementById('admin-attach-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const filePath = `${selectedClient.id}/${Date.now()}_${file.name}`;
      const { error } = await supabaseClient.storage.from('message-attachments').upload(filePath, file);
      if (error) { alert('Upload failed: ' + error.message); return; }
      const { data: urlData } = supabaseClient.storage.from('message-attachments').getPublicUrl(filePath);
      pendingAdminAttachment = { url: urlData.publicUrl, name: file.name };
      document.getElementById('admin-attachment-name').textContent = '📎 ' + file.name;
      document.getElementById('admin-attachment-chip').style.display = 'flex';
    });
    document.getElementById('admin-remove-attachment').addEventListener('click', () => {
      pendingAdminAttachment = null;
      document.getElementById('admin-attachment-chip').style.display = 'none';
      document.getElementById('admin-attach-input').value = '';
    });

    loadAdminMessages();
    loadAdminReports();
    loadAdminRequests();
    loadAdminNote();
  }

  let pendingAdminAttachment = null;

  async function loadAdminNote() {
    const { data } = await supabaseClient.from('admin_notes').select('note').eq('client_id', selectedClient.id).maybeSingle();
    document.getElementById('admin-note-textarea').value = data ? data.note : '';
  }

  async function saveAdminNote() {
    const note = document.getElementById('admin-note-textarea').value;
    const msgEl = document.getElementById('note-save-msg');
    const { error } = await supabaseClient.from('admin_notes').upsert({ client_id: selectedClient.id, note, updated_at: new Date().toISOString() }, { onConflict: 'client_id' });
    msgEl.textContent = error ? 'Error: ' + error.message : 'Saved!';
  }

  // ==========================================================
  // HOME ACTIVITY FEED
  // ==========================================================

  async function renderHomeFeed() {
    const panel = document.getElementById('client-panel');
    panel.innerHTML = `
      <h1 style="font-size:1.5rem; margin-bottom:4px;">Recent Activity</h1>
      <p class="sub" style="margin-bottom:24px;">The latest messages and requests across all your clients.</p>
      <div class="card-box">
        <div id="home-feed-list"><p class="empty-state">Loading...</p></div>
      </div>
    `;

    const [messagesRes, requestsRes] = await Promise.all([
      supabaseClient.from('messages').select('*').order('created_at', { ascending: false }).limit(10),
      supabaseClient.from('requests').select('*').order('created_at', { ascending: false }).limit(10)
    ]);

    const clientMap = {};
    allClients.forEach(c => clientMap[c.id] = c);

    const items = [
      ...(messagesRes.data || []).map(m => ({
        type: 'message', date: m.created_at, clientId: m.client_id,
        title: (m.sender_role === 'client' ? 'New message from ' : 'You replied to ') + (clientMap[m.client_id]?.business_name || clientMap[m.client_id]?.email || 'a client'),
        desc: m.content || '[Attachment]',
        unread: m.sender_role === 'client' && !m.read_by_admin,
        jumpTab: 'messages'
      })),
      ...(requestsRes.data || []).map(r => ({
        type: 'request', date: r.created_at, clientId: r.client_id,
        title: 'Request from ' + (clientMap[r.client_id]?.business_name || clientMap[r.client_id]?.email || 'a client'),
        desc: r.title + ' · ' + r.status.replace('_',' '),
        unread: false,
        jumpTab: 'requests'
      }))
    ].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 12);

    const listEl = document.getElementById('home-feed-list');
    if (items.length === 0) {
      listEl.innerHTML = '<p class="empty-state">No activity yet.</p>';
      return;
    }
    const icons = { message: '💬', request: '📝' };
    listEl.innerHTML = items.map((item, i) => `
      <div class="home-feed-item" data-index="${i}">
        <div style="display:flex; gap:12px; align-items:flex-start;">
          <div class="feed-icon" style="width:34px; height:34px; border-radius:9px; background:var(--off-white); display:flex; align-items:center; justify-content:center; flex:none;">${icons[item.type]}</div>
          <div>
            <h4>${escapeHtml(item.title)} ${item.unread ? '<span class="unread-badge" style="position:static; margin-left:6px;">new</span>' : ''}</h4>
            <p>${escapeHtml((item.desc || '').slice(0, 90))} · ${timeAgo(item.date)}</p>
          </div>
        </div>
      </div>
    `).join('');

    listEl.querySelectorAll('.home-feed-item').forEach(el => {
      el.addEventListener('click', () => {
        const item = items[parseInt(el.dataset.index)];
        const client = clientMap[item.clientId];
        if (!client) return;
        selectClient(client);
        setTimeout(() => {
          const tabBtn = document.querySelector(`.tab-btn[data-tab="${item.jumpTab}"]`);
          if (tabBtn) tabBtn.click();
        }, 50);
      });
    });
  }

  // ---- Messages (admin side) ----
  async function loadAdminMessages() {
    await supabaseClient.from('messages')
      .update({ read_by_admin: true })
      .eq('client_id', selectedClient.id)
      .eq('sender_role', 'client')
      .eq('read_by_admin', false);
    delete unreadCounts[selectedClient.id];
    renderClientList(allClients);

    const { data, error } = await supabaseClient
      .from('messages').select('*')
      .eq('client_id', selectedClient.id)
      .order('created_at', { ascending: true });

    const thread = document.getElementById('admin-message-thread');
    if (error || !data || data.length === 0) {
      thread.innerHTML = '<p class="empty-state">No messages yet with this client.</p>';
      return;
    }
    thread.innerHTML = data.map(m => `
      <div class="msg ${m.sender_role === 'admin' ? 'client' : 'admin'}">
        ${escapeHtml(m.content)}
        ${m.file_url ? `<a class="msg-attachment" href="${escapeHtml(m.file_url)}" target="_blank" rel="noopener">📎 ${escapeHtml(m.file_name || 'Attachment')}</a>` : ''}
        <span class="msg-time">${timeAgo(m.created_at)}</span>
      </div>
    `).join('');
    thread.scrollTop = thread.scrollHeight;
  }

  async function sendAdminMessage(e) {
    e.preventDefault();
    const input = document.getElementById('admin-message-input');
    const content = input.value.trim();
    if (!content && !pendingAdminAttachment) return;

    const { error } = await supabaseClient.from('messages').insert({
      client_id: selectedClient.id,
      sender_role: 'admin',
      content: content,
      file_url: pendingAdminAttachment ? pendingAdminAttachment.url : null,
      file_name: pendingAdminAttachment ? pendingAdminAttachment.name : null
    });

    if (!error) {
      input.value = '';
      pendingAdminAttachment = null;
      document.getElementById('admin-attachment-chip').style.display = 'none';
      document.getElementById('admin-attach-input').value = '';
      loadAdminMessages();
      fetch('/api/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: selectedClient.email,
          toName: selectedClient.business_name || selectedClient.contact_name,
          subject: 'New message from BINet Funnel Digitals',
          message: escapeHtml(content || '[Sent an attachment]')
        })
      }).catch(() => {});
    } else {
      alert('Could not send: ' + error.message);
    }
  }

  // ---- Reports (admin side) ----
  async function loadAdminReports() {
    const { data, error } = await supabaseClient
      .from('reports').select('*')
      .eq('client_id', selectedClient.id)
      .order('uploaded_at', { ascending: false });

    const list = document.getElementById('admin-reports-list');
    if (error || !data || data.length === 0) {
      list.innerHTML = '<p class="empty-state">No reports uploaded for this client yet.</p>';
      return;
    }
    list.innerHTML = data.map(r => `
      <div class="list-item">
        <div>
          <h4>${escapeHtml(r.title)}</h4>
          <p>${r.period ? escapeHtml(r.period) + ' · ' : ''}${timeAgo(r.uploaded_at)}</p>
        </div>
        ${r.file_url ? `<a href="${escapeHtml(r.file_url)}" target="_blank" rel="noopener" class="btn btn-outline" style="color:var(--navy); border-color:#DDE1E7;">View</a>` : ''}
      </div>
    `).join('');
  }

  async function uploadReport() {
    const title = document.getElementById('report-title').value.trim();
    const period = document.getElementById('report-period').value.trim();
    const fileInput = document.getElementById('report-file');
    const file = fileInput.files[0];
    const btn = document.getElementById('upload-report-btn');

    if (!title) { alert('Please add a report title.'); return; }

    btn.textContent = 'Uploading...';
    let file_url = null;

    if (file) {
      const filePath = `${selectedClient.id}/${Date.now()}_${file.name}`;
      const { error: uploadError } = await supabaseClient.storage.from('reports').upload(filePath, file);
      if (uploadError) {
        alert('File upload failed: ' + uploadError.message);
        btn.textContent = 'Upload';
        return;
      }
      const { data: urlData } = supabaseClient.storage.from('reports').getPublicUrl(filePath);
      file_url = urlData.publicUrl;
    }

    const { error } = await supabaseClient.from('reports').insert({
      client_id: selectedClient.id,
      title, period, file_url
    });

    btn.textContent = 'Upload';
    if (!error) {
      document.getElementById('report-title').value = '';
      document.getElementById('report-period').value = '';
      fileInput.value = '';
      loadAdminReports();
      fetch('/api/send-email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          to: selectedClient.email,
          toName: selectedClient.business_name || selectedClient.contact_name,
          subject: 'New report available — BINet Funnel Digitals',
          message: 'A new report "' + escapeHtml(title) + '" has been uploaded to your dashboard. Log in to view it.'
        })
      }).catch(() => {});
    } else {
      alert('Could not save report: ' + error.message);
    }
  }

  // ---- Requests (admin side) ----
  async function loadAdminRequests() {
    const { data, error } = await supabaseClient
      .from('requests').select('*')
      .eq('client_id', selectedClient.id)
      .order('created_at', { ascending: false });

    const list = document.getElementById('admin-requests-list');
    if (error || !data || data.length === 0) {
      list.innerHTML = '<p class="empty-state">No requests from this client yet.</p>';
      return;
    }
    list.innerHTML = data.map(r => `
      <div class="list-item">
        <div>
          <h4>${escapeHtml(r.title)}</h4>
          <p>${escapeHtml(r.description || '')}</p>
        </div>
        <select class="status-select" data-id="${r.id}">
          <option value="open" ${r.status === 'open' ? 'selected' : ''}>Open</option>
          <option value="in_progress" ${r.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
          <option value="done" ${r.status === 'done' ? 'selected' : ''}>Done</option>
        </select>
      </div>
    `).join('');

    list.querySelectorAll('.status-select').forEach(sel => {
      sel.addEventListener('change', async () => {
        await supabaseClient.from('requests').update({ status: sel.value }).eq('id', sel.dataset.id);
        loadOpenRequestsCount();
      });
    });
  }

  // ==========================================================
  // BROADCAST TOOL
  // ==========================================================

  async function uploadAndInsertImage(file, index) {
    document.getElementById('image-upload-status').style.display = 'block';
    const filePath = `broadcast-images/${Date.now()}_${file.name}`;
    const { error } = await supabaseClient.storage.from('email-assets').upload(filePath, file);
    document.getElementById('image-upload-status').style.display = 'none';
    if (error) { alert('Image upload failed: ' + error.message); return; }
    const { data: urlData } = supabaseClient.storage.from('email-assets').getPublicUrl(filePath);
    quill.insertEmbed(index, 'image', urlData.publicUrl);
    quill.setSelection(index + 1);
  }

  function quillImageHandler() {
    const input = document.createElement('input');
    input.setAttribute('type', 'file');
    input.setAttribute('accept', 'image/*');
    input.click();
    input.onchange = async () => {
      const file = input.files[0];
      if (!file) return;
      const range = quill.getSelection(true) || { index: quill.getLength() };
      await uploadAndInsertImage(file, range.index);
    };
  }

  function makeImagesResponsive(html) {
    const div = document.createElement('div');
    div.innerHTML = html;
    div.querySelectorAll('img').forEach(img => {
      img.setAttribute('style', 'max-width:100%; height:auto; display:block; border-radius:8px; margin:12px 0;');
    });
    return div.innerHTML;
  }

  async function loadBrevoTemplates() {
    const select = document.getElementById('template-picker');
    try {
      const res = await fetch('/api/list-templates', {
        headers: { 'Authorization': 'Bearer ' + currentSession.access_token }
      });
      const result = await res.json();
      if (!res.ok || !result.templates || result.templates.length === 0) {
        select.innerHTML = '<option value="">No saved templates found</option>';
        return;
      }
      select.innerHTML = result.templates.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('');
    } catch {
      select.innerHTML = '<option value="">Could not load templates</option>';
    }
  }

  function renderBroadcastPanel() {
    selectedClient = null;
    renderClientList(allClients);

    const panel = document.getElementById('client-panel');
    const clientOptions = allClients.map(c => `
      <label style="display:flex; align-items:center; gap:8px; padding:8px 0; font-size:0.88rem; border-bottom:1px solid #EEF0F3;">
        <input type="checkbox" class="broadcast-recipient" value="${c.id}" data-email="${c.email}" data-name="${(c.business_name || c.email).replace(/"/g,'')}" checked>
        ${escapeHtml(c.business_name || c.email)} <span style="color:var(--slate);">(${escapeHtml(c.email)})</span>
      </label>
    `).join('');

    panel.innerHTML = `
      <h1 style="font-size:1.5rem; margin-bottom:4px;">New Broadcast</h1>
      <p class="sub" style="margin-bottom:24px;">Send one email to some or all of your clients at once.</p>
      <div class="card-box">

        <div style="display:flex; gap:20px; margin-bottom:20px;">
          <label style="font-size:0.88rem; display:flex; align-items:center; gap:6px;"><input type="radio" name="compose-mode" value="custom" checked> Write custom message</label>
          <label style="font-size:0.88rem; display:flex; align-items:center; gap:6px;"><input type="radio" name="compose-mode" value="template"> Use a saved template</label>
        </div>

        <div id="template-picker-wrap" style="display:none; margin-bottom:20px;">
          <label style="font-size:0.86rem; font-weight:600; display:block; margin-bottom:6px;">Choose template</label>
          <select id="template-picker" class="status-select" style="width:100%; padding:12px 14px;">
            <option value="">Loading templates...</option>
          </select>
        </div>

        <div id="custom-compose-wrap">
          <div style="margin-bottom:16px;">
            <label style="font-size:0.86rem; font-weight:600; display:block; margin-bottom:6px;">Subject</label>
            <input type="text" id="broadcast-subject" placeholder="e.g. New service launching this month" style="width:100%; padding:12px 14px; border-radius:8px; border:1px solid #DDE1E7; background:var(--off-white);">
          </div>
          <div style="margin-bottom:16px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <label style="font-size:0.86rem; font-weight:600;">Message</label>
              <button type="button" id="insert-file-link-btn" class="btn btn-outline" style="color:var(--navy); border-color:#DDE1E7; padding:6px 12px; font-size:0.8rem;">+ Attach File Link</button>
            </div>
            <div id="broadcast-editor" style="background:var(--white); border-radius:8px; border:1px solid #DDE1E7; min-height:200px;"></div>
            <p id="image-upload-status" style="font-size:0.8rem; color:var(--slate); margin-top:6px; display:none;">Uploading image...</p>
          </div>
        </div>

        <div style="margin-bottom:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <label style="font-size:0.86rem; font-weight:600;">Recipients (${allClients.length})</label>
            <button type="button" id="toggle-all-recipients" class="btn btn-outline" style="color:var(--navy); border-color:#DDE1E7; padding:6px 12px; font-size:0.8rem;">Toggle All</button>
          </div>
          <div style="max-height:220px; overflow-y:auto; border:1px solid #EEF0F3; border-radius:8px; padding:10px 14px;">
            ${clientOptions || '<p class="empty-state">No clients yet.</p>'}
          </div>
        </div>

        <button id="send-broadcast-btn" class="btn btn-green">Send Broadcast</button>
        <p id="broadcast-result" style="margin-top:14px; font-size:0.88rem; color:var(--slate);"></p>
      </div>
    `;

    quill = new Quill('#broadcast-editor', {
      theme: 'snow',
      placeholder: 'Write your message here...',
      modules: {
        toolbar: {
          container: [
            [{ header: [2, 3, false] }],
            ['bold', 'italic', 'underline'],
            ['link', 'image'],
            [{ list: 'ordered' }, { list: 'bullet' }],
            ['clean']
          ],
          handlers: { image: () => quillImageHandler() }
        }
      }
    });

    const editorEl = document.querySelector('#broadcast-editor .ql-editor');
    editorEl.addEventListener('dragover', (e) => e.preventDefault());
    editorEl.addEventListener('drop', async (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        const range = quill.getSelection(true) || { index: quill.getLength() };
        await uploadAndInsertImage(file, range.index);
      }
    });
    editorEl.addEventListener('paste', async (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          const file = item.getAsFile();
          const range = quill.getSelection(true) || { index: quill.getLength() };
          await uploadAndInsertImage(file, range.index);
        }
      }
    });

    document.getElementById('insert-file-link-btn').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.click();
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        const filePath = `broadcast-files/${Date.now()}_${file.name}`;
        const { error } = await supabaseClient.storage.from('email-assets').upload(filePath, file);
        if (error) { alert('File upload failed: ' + error.message); return; }
        const { data: urlData } = supabaseClient.storage.from('email-assets').getPublicUrl(filePath);
        const range = quill.getSelection(true) || { index: quill.getLength() };
        quill.insertText(range.index, file.name, { link: urlData.publicUrl });
        quill.insertText(range.index + file.name.length, ' ');
      };
    });

    document.querySelectorAll('input[name="compose-mode"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const useTemplate = e.target.value === 'template';
        document.getElementById('template-picker-wrap').style.display = useTemplate ? 'block' : 'none';
        document.getElementById('custom-compose-wrap').style.display = useTemplate ? 'none' : 'block';
      });
    });

    loadBrevoTemplates();

    document.getElementById('toggle-all-recipients').addEventListener('click', () => {
      const boxes = document.querySelectorAll('.broadcast-recipient');
      const anyUnchecked = Array.from(boxes).some(b => !b.checked);
      boxes.forEach(b => b.checked = anyUnchecked);
    });

    document.getElementById('send-broadcast-btn').addEventListener('click', sendBroadcast);
  }

  async function sendBroadcast() {
    const useTemplate = document.querySelector('input[name="compose-mode"]:checked').value === 'template';
    const resultEl = document.getElementById('broadcast-result');
    const btn = document.getElementById('send-broadcast-btn');

    const recipients = Array.from(document.querySelectorAll('.broadcast-recipient:checked')).map(cb => ({
      email: cb.dataset.email,
      name: cb.dataset.name
    }));

    if (recipients.length === 0) { alert('Select at least one recipient.'); return; }

    let payload = { recipients };

    if (useTemplate) {
      const templateId = document.getElementById('template-picker').value;
      if (!templateId) { alert('Please choose a template.'); return; }
      payload.templateId = templateId;
    } else {
      const subject = document.getElementById('broadcast-subject').value.trim();
      const message = makeImagesResponsive(quill.root.innerHTML.trim());
      if (!subject || !message || message === '<p><br></p>') { alert('Please fill in both subject and message.'); return; }
      payload.subject = subject;
      payload.message = message;
      payload.isHtml = true;
    }

    btn.textContent = 'Sending...';
    resultEl.textContent = '';

    const res = await fetch('/api/broadcast', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + currentSession.access_token
      },
      body: JSON.stringify(payload)
    });

    const result = await res.json();
    btn.textContent = 'Send Broadcast';

    if (!res.ok) {
      resultEl.style.color = '#791F1F';
      resultEl.textContent = 'Error: ' + (result.error?.message || JSON.stringify(result.error));
      return;
    }

    resultEl.style.color = '#0F7A4C';
    resultEl.textContent = `Sent to ${result.sent} of ${result.total} recipients` + (result.failed > 0 ? ` (${result.failed} failed)` : '') + '.';
  }

  document.getElementById('broadcast-btn').addEventListener('click', renderBroadcastPanel);

  // ==========================================================
  // ANALYTICS
  // ==========================================================

  let charts = [];

  function destroyCharts() {
    charts.forEach(c => c.destroy());
    charts = [];
  }

  function monthLabel(dateStr) {
    return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
  }

  async function renderAnalyticsPanel() {
    selectedClient = null;
    renderClientList(allClients);
    destroyCharts();

    const panel = document.getElementById('client-panel');
    panel.innerHTML = `
      <h1 style="font-size:1.5rem; margin-bottom:4px;">Analytics</h1>
      <p class="sub" style="margin-bottom:24px;">A live snapshot of how your agency is growing.</p>

      <div class="admin-stats" style="margin-bottom:24px;">
        <div class="stat-card"><div class="num" id="an-total-clients">–</div><div class="label">Total Clients</div></div>
        <div class="stat-card"><div class="num" id="an-total-messages">–</div><div class="label">Total Messages</div></div>
        <div class="stat-card"><div class="num" id="an-total-reports">–</div><div class="label">Reports Uploaded</div></div>
      </div>

      <div class="card-box">
        <h3 style="font-size:1rem; margin-bottom:16px;">Client Growth Over Time</h3>
        <canvas id="chart-clients" height="90"></canvas>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
        <div class="card-box">
          <h3 style="font-size:1rem; margin-bottom:16px;">Request Status Breakdown</h3>
          <canvas id="chart-requests" height="220"></canvas>
        </div>
        <div class="card-box">
          <h3 style="font-size:1rem; margin-bottom:16px;">Messages: You vs Clients</h3>
          <canvas id="chart-messages" height="220"></canvas>
        </div>
      </div>
    `;

    const [requestsRes, messagesRes, reportsRes] = await Promise.all([
      supabaseClient.from('requests').select('status, created_at'),
      supabaseClient.from('messages').select('sender_role, created_at'),
      supabaseClient.from('reports').select('id')
    ]);

    const requests = requestsRes.data || [];
    const messages = messagesRes.data || [];
    const reports = reportsRes.data || [];

    document.getElementById('an-total-clients').textContent = allClients.length;
    document.getElementById('an-total-messages').textContent = messages.length;
    document.getElementById('an-total-reports').textContent = reports.length;

    // ---- Client growth by month ----
    const growthMap = {};
    allClients.forEach(c => {
      const label = monthLabel(c.created_at);
      growthMap[label] = (growthMap[label] || 0) + 1;
    });
    const growthLabels = Object.keys(growthMap);
    const growthData = Object.values(growthMap);

    charts.push(new Chart(document.getElementById('chart-clients'), {
      type: 'line',
      data: {
        labels: growthLabels,
        datasets: [{
          label: 'New Clients',
          data: growthData,
          borderColor: '#1D9E75',
          backgroundColor: 'rgba(29,158,117,0.12)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
      }
    }));

    // ---- Request status breakdown ----
    const statusCounts = { open: 0, in_progress: 0, done: 0 };
    requests.forEach(r => { if (statusCounts[r.status] !== undefined) statusCounts[r.status]++; });

    charts.push(new Chart(document.getElementById('chart-requests'), {
      type: 'doughnut',
      data: {
        labels: ['Open', 'In Progress', 'Done'],
        datasets: [{
          data: [statusCounts.open, statusCounts.in_progress, statusCounts.done],
          backgroundColor: ['#D4A017', '#0B5A96', '#1D9E75']
        }]
      },
      options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
    }));

    // ---- Messages: admin vs client ----
    const adminMsgs = messages.filter(m => m.sender_role === 'admin').length;
    const clientMsgs = messages.filter(m => m.sender_role === 'client').length;

    charts.push(new Chart(document.getElementById('chart-messages'), {
      type: 'bar',
      data: {
        labels: ['You', 'Clients'],
        datasets: [{
          label: 'Messages',
          data: [adminMsgs, clientMsgs],
          backgroundColor: ['#0A1628', '#1D9E75']
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
      }
    }));
  }

  document.getElementById('analytics-btn').addEventListener('click', renderAnalyticsPanel);
</script>

</body>
</html>

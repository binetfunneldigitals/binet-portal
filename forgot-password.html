<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — BINet Funnel Digitals</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<style>
.login-wrap{min-height:calc(100vh - 74px); display:flex; align-items:center; justify-content:center; background:var(--off-white); padding:40px 20px;}
.login-card{width:100%; max-width:400px; background:var(--white); border:1px solid #E7E9EE; border-radius:16px; padding:40px 34px;}
.login-card h1{font-size:1.5rem; margin-bottom:8px;}
.login-card p.sub{color:var(--slate); font-size:0.92rem; margin-bottom:26px;}
.login-card form{display:flex; flex-direction:column; gap:18px;}
.login-card button{width:100%; justify-content:center; padding:13px;}
#msg-box{display:none; padding:12px 14px; border-radius:8px; font-size:0.86rem; margin-bottom:16px;}
.switch-link{font-size:0.88rem; color:var(--slate); margin-top:20px; text-align:center;}
.switch-link a{color:var(--green); font-weight:600;}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="BINet Funnel Digitals logo">
      <span>BINet Funnel Digitals</span>
    </a>
  </div>
</header>

<div class="login-wrap">
  <div class="login-card">
    <h1>Reset your password</h1>
    <p class="sub">Enter your email and we'll send you a reset link.</p>
    <div id="msg-box"></div>
    <form id="reset-form">
      <div>
        <label for="email" style="font-size:0.86rem; font-weight:600; display:block; margin-bottom:6px;">Email</label>
        <input type="email" id="email" required style="width:100%; padding:12px 14px; border-radius:8px; border:1px solid #DDE1E7; background:var(--off-white);">
      </div>
      <button type="submit" class="btn btn-green" id="reset-btn">Send Reset Link</button>
    </form>
    <p class="switch-link">Remembered it? <a href="login.html">Log in</a></p>
  </div>
</div>

<script>
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const form = document.getElementById('reset-form');
  const msgBox = document.getElementById('msg-box');
  const btn = document.getElementById('reset-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.textContent = 'Sending...';
    const email = document.getElementById('email').value.trim();

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html'
    });

    msgBox.style.display = 'block';
    if (error) {
      msgBox.style.background = '#FCEBEB';
      msgBox.style.color = '#791F1F';
      msgBox.textContent = 'Error: ' + error.message;
    } else {
      msgBox.style.background = '#E9F7F1';
      msgBox.style.color = '#0F5D3F';
      msgBox.textContent = 'Check ' + email + ' for a reset link.';
      form.style.display = 'none';
    }
    btn.textContent = 'Send Reset Link';
  });
</script>

</body>
</html>

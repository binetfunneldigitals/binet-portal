<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POS Checkout — BINet Funnel Digitals</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<style>
  .client-nav-link{
    display:flex; align-items:center; padding:12px 14px; border-radius:10px; margin-bottom:2px;
    color:var(--navy); font-size:0.92rem; text-decoration:none; position:relative;
  }
  .client-nav-link:hover{ background:var(--off-white); }
  .client-nav-link.active{ background:rgba(29,158,117,0.1); color:var(--green); font-weight:600; }

  .pos-shell{ display:grid; grid-template-columns:240px 1fr 380px; min-height:calc(100vh - 65px); }
  .pos-products{ padding:24px; overflow-y:auto; }
  .pos-cart{ background:var(--white); border-left:1px solid #E7E9EE; padding:24px; display:flex; flex-direction:column; overflow-y:auto; }
  .pos-search{ width:100%; padding:12px 14px; border-radius:8px; border:1px solid #DDE1E7; margin-bottom:18px; font-size:0.95rem; }
  .pos-product-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; }
  .pos-product-card{
    background:var(--white); border:1px solid #E7E9EE; border-radius:12px; padding:12px; cursor:pointer;
    transition:border-color .15s ease, transform .15s ease;
  }
  .pos-product-card:hover{ border-color:var(--green); transform:translateY(-2px); }
  .pos-product-card.out-of-stock{ opacity:0.45; cursor:not-allowed; }
  .pos-product-card img{ width:100%; height:80px; object-fit:cover; border-radius:8px; margin-bottom:8px; background:var(--off-white); }
  .pos-product-card .no-img{ width:100%; height:80px; border-radius:8px; margin-bottom:8px; background:var(--off-white); display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:#C9D0DC; }
  .pos-product-card h4{ font-size:0.85rem; margin-bottom:4px; }
  .pos-product-card p{ font-size:0.78rem; color:var(--slate); }
  .pos-product-card .stock-tag{ font-size:0.7rem; color:var(--green); font-weight:600; }
  .pos-product-card.out-of-stock .stock-tag{ color:#D64545; }
  .cart-items{ flex:1; overflow-y:auto; margin-bottom:16px; }
  .cart-item{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #EEF0F3; }
  .cart-item h5{ font-size:0.85rem; margin-bottom:2px; }
  .cart-item p{ font-size:0.78rem; color:var(--slate); }
  .cart-qty-controls{ display:flex; align-items:center; gap:6px; }
  .cart-qty-controls button{ width:24px; height:24px; border-radius:6px; border:1px solid #DDE1E7; background:var(--off-white); cursor:pointer; font-size:0.85rem; }
  .cart-totals{ border-top:1px solid #E7E9EE; padding-top:14px; margin-bottom:16px; }
  .cart-totals .row{ display:flex; justify-content:space-between; font-size:0.88rem; margin-bottom:6px; color:var(--slate); }
  .cart-totals .row.total{ font-size:1.1rem; font-weight:700; color:var(--navy); margin-top:8px; }
  .pos-field label{ font-size:0.82rem; font-weight:600; display:block; margin-bottom:5px; }
  .pos-field input, .pos-field select{ width:100%; padding:9px 10px; border-radius:7px; border:1px solid #DDE1E7; background:var(--off-white); font-size:0.88rem; margin-bottom:10px; }
  .receipt-modal{ position:fixed; inset:0; background:rgba(10,22,40,0.6); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; overflow-y:auto; }
  .receipt-modal.open{ display:flex; }
  .receipt-box{ background:var(--white); border-radius:14px; overflow:hidden; max-width:560px; width:100%; max-height:90vh; overflow-y:auto; }
  .receipt-actions{ display:flex; gap:10px; padding:0 32px 24px; }
  .receipt-actions .btn{ flex:1; justify-content:center; font-size:0.85rem; padding:11px; }
  .inv-header{ background:var(--navy); color:#fff; padding:32px 32px 22px; }
  .inv-header-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .inv-biz-name{ font-family:'Space Grotesk',sans-serif; font-size:1.3rem; font-weight:700; margin-bottom:8px; }
  .inv-biz-details{ font-size:0.78rem; color:#B9C2D1; line-height:1.6; }
  .inv-title{ font-family:'Space Grotesk',sans-serif; font-size:1.6rem; font-weight:700; text-align:right; }
  .inv-meta{ font-size:0.78rem; color:#B9C2D1; text-align:right; line-height:1.7; margin-top:6px; }
  .inv-accent-bar{ height:4px; background:var(--gold); }
  .inv-body{ padding:24px 32px 32px; }
  .inv-boxes{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:22px; }
  .inv-box{ background:var(--off-white); border-radius:10px; overflow:hidden; }
  .inv-box-head{ background:var(--navy); color:#fff; font-size:0.72rem; font-weight:700; letter-spacing:0.04em; padding:8px 14px; }
  .inv-box-body{ padding:12px 14px; font-size:0.85rem; }
  .inv-box-body .label{ color:var(--slate); font-size:0.75rem; }
  .inv-box-body .val{ font-weight:600; color:var(--navy); }
  .inv-box-body .paid{ color:var(--green); font-weight:700; }
  .inv-box-body .partial{ color:var(--gold); font-weight:700; }
  .inv-box-body .unpaid{ color:#D64545; font-weight:700; }
  .inv-table{ width:100%; border-collapse:collapse; margin-bottom:20px; font-size:0.85rem; }
  .inv-table thead th{ background:var(--navy); color:#fff; text-align:left; padding:9px 12px; font-size:0.72rem; letter-spacing:0.03em; }
  .inv-table thead th.num{ text-align:right; }
  .inv-table tbody td{ padding:10px 12px; border-bottom:1px solid #EEF0F3; }
  .inv-table tbody td.num{ text-align:right; }
  .inv-totals-row{ display:flex; justify-content:flex-end; align-items:center; gap:24px; margin-bottom:8px; }
  .inv-stamp-wrap{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .inv-stamp{
    width:74px; height:74px; border-radius:50%; border:3px solid; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:0.72rem; letter-spacing:0.05em; transform:rotate(-8deg);
  }
  .inv-totals{ text-align:right; }
  .inv-totals .row{ display:flex; justify-content:space-between; gap:30px; font-size:0.85rem; color:var(--slate); margin-bottom:5px; }
  .inv-totals .row.grand{ background:var(--navy); color:#fff; font-size:1rem; font-weight:700; padding:9px 14px; border-radius:8px; margin-top:8px; }
  .inv-footer{ border-top:1px dashed #DDE1E7; margin-top:22px; padding-top:16px; text-align:center; }
  .inv-footer p{ font-size:0.82rem; color:var(--slate); }
  @media (max-width:1000px){ .pos-shell{ grid-template-columns:1fr; } .pos-cart{ border-left:none; border-top:1px solid #E7E9EE; } }
  @media print{
    @page{ size:A4; margin:12mm; }
    body *{ visibility:hidden; }
    #receipt-box, #receipt-box *{ visibility:visible; }
    #receipt-box{ position:absolute; top:0; left:0; width:100%; max-width:100%; box-shadow:none; border-radius:0; }
    .receipt-actions{ display:none; }
  }
</style>
</head>
<body class="dash-shell">

<div class="dash-topbar">
  <div class="wrap">
    <a class="brand" href="dashboard.html">
      <img src="assets/logo.png" alt="BINet Funnel Digitals logo" style="height:32px;">
      <span>Point of Sale</span>
    </a>
    <div class="dash-user">
      <span id="user-label">Loading...</span>
      <button id="logout-btn" class="btn btn-outline">Log Out</button>
    </div>
  </div>
</div>

<div class="pos-shell">
  <div class="admin-sidebar">
    <nav>
      <a class="client-nav-link" href="dashboard.html#overview">🏠 Overview</a>
      <a class="client-nav-link" href="dashboard.html#messages">💬 Messages</a>
      <a class="client-nav-link" href="dashboard.html#reports">📄 Reports</a>
      <a class="client-nav-link" href="dashboard.html#requests">📝 Requests</a>
      <a class="client-nav-link" href="dashboard.html#inventory">📦 Products &amp; Services</a>
      <a class="client-nav-link active" href="pos.html">🧾 Point of Sale</a>
      <a class="client-nav-link" href="dashboard.html#account">⚙️ Account</a>
    </nav>
  </div>

  <div class="pos-products">
    <input type="text" class="pos-search" id="product-search" placeholder="Search by name or code...">
    <div class="pos-product-grid" id="product-grid">
      <p class="empty-state">Loading products &amp; services...</p>
    </div>
  </div>

  <div class="pos-cart">
    <h3 style="font-size:1.05rem; margin-bottom:16px;">Current Sale</h3>
    <div class="cart-items" id="cart-items">
      <p class="empty-state">Cart is empty. Tap an item to add it.</p>
    </div>

    <div class="cart-totals">
      <div class="row"><span>Subtotal</span><span id="cart-subtotal">₦0</span></div>
      <div class="pos-field" style="margin-top:10px;">
        <label>Discount (₦)</label>
        <input type="number" id="cart-discount" value="0" min="0">
      </div>
      <div class="row total"><span>Total</span><span id="cart-total">₦0</span></div>
    </div>

    <div class="pos-field">
      <label>Customer name (optional)</label>
      <input type="text" id="customer-name">
    </div>
    <div class="pos-field">
      <label>Customer WhatsApp number (optional)</label>
      <input type="text" id="customer-phone" placeholder="e.g. 08031234567">
    </div>
    <div class="pos-field">
      <label>Payment method</label>
      <select id="payment-method">
        <option value="cash">Cash</option>
        <option value="transfer">Bank Transfer</option>
        <option value="card">Card</option>
        <option value="mobile_money">Mobile Money</option>
      </select>
    </div>
    <div class="pos-field" style="display:flex; align-items:center; gap:8px;">
      <input type="checkbox" id="is-credit-check" style="width:auto; margin:0;">
      <label style="margin:0;">This is a credit sale (pay later)</label>
    </div>
    <div class="pos-field" id="amount-paid-wrap" style="display:none;">
      <label>Amount paid now (₦)</label>
      <input type="number" id="amount-paid" value="0" min="0">
    </div>

    <button class="btn btn-green" id="complete-sale-btn" style="width:100%; justify-content:center; padding:13px;">Complete Sale</button>
  </div>
</div>

<div class="receipt-modal" id="receipt-modal">
  <div class="receipt-box" id="receipt-box"></div>
</div>

<script>
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let currentUser = null;
  let allProducts = [];
  let cart = [];

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function money(n) {
    return '₦' + Number(n || 0).toLocaleString();
  }

  function normalizePhone(phone) {
    let p = (phone || '').replace(/[^0-9]/g, '');
    if (p.startsWith('0')) p = '234' + p.slice(1);
    return p;
  }

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
    if (!profile) { window.location.href = 'login.html'; return; }

    if (profile.plan !== 'pro' && profile.plan !== 'enterprise') {
      alert('POS Checkout is available on Pro and Enterprise plans. Contact us to upgrade.');
      window.location.href = 'dashboard.html';
      return;
    }

    currentUser = { id: session.user.id, ...profile };
    document.getElementById('user-label').textContent = profile.business_name || profile.email;
    loadProducts();
  })();

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'login.html';
  });

  async function loadProducts() {
    const { data, error } = await supabaseClient
      .from('products')
      .select('*')
      .eq('client_id', currentUser.id)
      .eq('is_active', true)
      .order('name', { ascending: true });

    allProducts = data || [];
    renderProductGrid(allProducts);
  }

  function renderProductGrid(products) {
    const grid = document.getElementById('product-grid');
    if (products.length === 0) {
      grid.innerHTML = '<p class="empty-state">No active products or services found. Add some from your dashboard.</p>';
      return;
    }
    grid.innerHTML = products.map(p => {
      const isService = p.item_type === 'service';
      const outOfStock = !isService && p.quantity <= 0;
      return `
      <div class="pos-product-card ${outOfStock ? 'out-of-stock' : ''}" data-id="${p.id}">
        ${p.image_url ? `<img src="${escapeHtml(p.image_url)}">` : `<div class="no-img">${isService ? '🛠️' : '📦'}</div>`}
        <h4>${escapeHtml(p.name)}</h4>
        <p>${p.product_code ? escapeHtml(p.product_code) : (isService ? 'Service' : '')}</p>
        <p>${money(p.selling_price)}</p>
        <p class="stock-tag">${isService ? 'Available' : (p.quantity > 0 ? p.quantity + ' in stock' : 'Out of stock')}</p>
      </div>
    `;
    }).join('');

    grid.querySelectorAll('.pos-product-card').forEach(card => {
      card.addEventListener('click', () => {
        const product = allProducts.find(p => p.id === card.dataset.id);
        if (product.item_type !== 'service' && product.quantity <= 0) return;
        addToCart(product);
      });
    });
  }

  document.getElementById('product-search').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    renderProductGrid(allProducts.filter(p =>
      p.name.toLowerCase().includes(q) || (p.product_code || '').toLowerCase().includes(q)
    ));
  });

  function addToCart(product) {
    const isService = product.item_type === 'service';
    const existing = cart.find(c => c.product_id === product.id);
    if (existing) {
      if (!isService && existing.quantity + 1 > product.quantity) { alert('Not enough stock.'); return; }
      existing.quantity += 1;
    } else {
      cart.push({
        product_id: product.id,
        name: product.name,
        unit_price: product.selling_price || 0,
        quantity: 1,
        isService,
        maxStock: isService ? Infinity : product.quantity
      });
    }
    renderCart();
  }

  function renderCart() {
    const cartEl = document.getElementById('cart-items');
    if (cart.length === 0) {
      cartEl.innerHTML = '<p class="empty-state">Cart is empty. Tap an item to add it.</p>';
    } else {
      cartEl.innerHTML = cart.map((item, i) => `
        <div class="cart-item">
          <div>
            <h5>${escapeHtml(item.name)} ${item.isService ? '<span style="color:var(--slate); font-size:0.72rem;">(service)</span>' : ''}</h5>
            <p>${money(item.unit_price)} × ${item.quantity} = ${money(item.unit_price * item.quantity)}</p>
          </div>
          <div class="cart-qty-controls">
            <button data-dec="${i}">−</button>
            <span>${item.quantity}</span>
            <button data-inc="${i}">+</button>
            <button data-remove="${i}" style="color:#791F1F;">✕</button>
          </div>
        </div>
      `).join('');

      cartEl.querySelectorAll('[data-inc]').forEach(btn => btn.addEventListener('click', () => {
        const item = cart[btn.dataset.inc];
        if (!item.isService && item.quantity + 1 > item.maxStock) { alert('Not enough stock.'); return; }
        item.quantity++; renderCart();
      }));
      cartEl.querySelectorAll('[data-dec]').forEach(btn => btn.addEventListener('click', () => {
        const item = cart[btn.dataset.dec];
        item.quantity = Math.max(1, item.quantity - 1); renderCart();
      }));
      cartEl.querySelectorAll('[data-remove]').forEach(btn => btn.addEventListener('click', () => {
        cart.splice(btn.dataset.remove, 1); renderCart();
      }));
    }
    updateTotals();
  }

  function updateTotals() {
    const subtotal = cart.reduce((sum, i) => sum + i.unit_price * i.quantity, 0);
    const discount = parseFloat(document.getElementById('cart-discount').value) || 0;
    const total = Math.max(0, subtotal - discount);
    document.getElementById('cart-subtotal').textContent = money(subtotal);
    document.getElementById('cart-total').textContent = money(total);
  }

  document.getElementById('cart-discount').addEventListener('input', updateTotals);

  document.getElementById('is-credit-check').addEventListener('change', (e) => {
    document.getElementById('amount-paid-wrap').style.display = e.target.checked ? 'block' : 'none';
  });

  let lastSaleItems = [];

  document.getElementById('complete-sale-btn').addEventListener('click', async () => {
    if (cart.length === 0) { alert('Cart is empty.'); return; }

    const subtotal = cart.reduce((sum, i) => sum + i.unit_price * i.quantity, 0);
    const discount = parseFloat(document.getElementById('cart-discount').value) || 0;
    const total = Math.max(0, subtotal - discount);
    const isCredit = document.getElementById('is-credit-check').checked;
    const amountPaid = isCredit ? (parseFloat(document.getElementById('amount-paid').value) || 0) : total;
    const balance = Math.max(0, total - amountPaid);
    const paymentMethod = document.getElementById('payment-method').value;
    const customerName = document.getElementById('customer-name').value.trim();
    const customerPhone = document.getElementById('customer-phone').value.trim();
    const btn = document.getElementById('complete-sale-btn');

    btn.textContent = 'Processing...';

    const { data: sale, error: saleError } = await supabaseClient.from('sales').insert({
      client_id: currentUser.id,
      subtotal, discount, total,
      payment_method: paymentMethod,
      is_credit: isCredit,
      amount_paid: amountPaid,
      balance,
      customer_name: customerName || null,
      customer_phone: customerPhone || null
    }).select().single();

    if (saleError) {
      alert('Could not complete sale: ' + saleError.message);
      btn.textContent = 'Complete Sale';
      return;
    }

    for (const item of cart) {
      const { error: itemError } = await supabaseClient.from('sale_items').insert({
        sale_id: sale.id,
        product_id: item.product_id,
        product_name: item.name,
        quantity: item.quantity,
        unit_price: item.unit_price,
        line_total: item.unit_price * item.quantity
      });
      if (itemError) {
        alert('Warning: some items may not have been recorded (' + itemError.message + '). Check your stock levels.');
      }
    }

    btn.textContent = 'Complete Sale';
    lastSaleItems = [...cart];
    showReceipt(sale, lastSaleItems);
    cart = [];
    document.getElementById('cart-discount').value = '0';
    document.getElementById('customer-name').value = '';
    document.getElementById('customer-phone').value = '';
    document.getElementById('is-credit-check').checked = false;
    document.getElementById('amount-paid-wrap').style.display = 'none';
    renderCart();
    loadProducts();
  });

  function invoiceNumber(sale) {
    const d = new Date(sale.created_at);
    const dateStr = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
    return `INV-${dateStr}-${String(sale.invoice_no || 0).padStart(4, '0')}`;
  }

  function paymentStatus(sale) {
    if (!sale.is_credit || sale.balance <= 0) return { label: 'PAID', cls: 'paid' };
    if (sale.amount_paid > 0) return { label: 'PARTIAL', cls: 'partial' };
    return { label: 'UNPAID', cls: 'unpaid' };
  }

  function buildReceiptText(sale, items) {
    const status = paymentStatus(sale);
    let text = `🧾 *${currentUser.business_name || 'BINet Funnel Digitals'}*\n`;
    text += `Invoice: ${invoiceNumber(sale)}\n`;
    text += `${new Date(sale.created_at).toLocaleString()}\n\n`;
    items.forEach(i => {
      if (i.isService) {
        text += `${i.name} — ${money(i.unit_price)}\n`;
      } else {
        text += `${i.name} x${i.quantity} — ${money(i.unit_price * i.quantity)}\n`;
      }
    });
    text += `\nSubtotal: ${money(sale.subtotal)}`;
    if (sale.discount > 0) text += `\nDiscount: -${money(sale.discount)}`;
    text += `\n*Total: ${money(sale.total)}*`;
    text += `\nPayment: ${sale.payment_method.replace('_',' ')} (${status.label})`;
    if (sale.is_credit) {
      text += `\nPaid now: ${money(sale.amount_paid)}`;
      text += `\nBalance owed: ${money(sale.balance)}`;
    }
    text += `\n\nThank you for your business!`;
    return text;
  }

  function showReceipt(sale, items) {
    const status = paymentStatus(sale);
    const biz = currentUser;
    const box = document.getElementById('receipt-box');

    box.innerHTML = `
      <div class="inv-header">
        <div class="inv-header-top">
          <div>
            <div class="inv-biz-name">${escapeHtml(biz.business_name || 'Your Business')}</div>
            <div class="inv-biz-details">
              ${biz.address ? escapeHtml(biz.address) + '<br>' : ''}
              ${biz.phone ? 'Phone: ' + escapeHtml(biz.phone) + '<br>' : ''}
              ${biz.vat_number ? 'VAT Number: ' + escapeHtml(biz.vat_number) : ''}
            </div>
          </div>
          <div>
            <div class="inv-title">INVOICE</div>
            <div class="inv-meta">
              ${invoiceNumber(sale)}<br>
              Date: ${new Date(sale.created_at).toLocaleDateString()}<br>
              Time: ${new Date(sale.created_at).toLocaleTimeString()}<br>
              Paid By: ${sale.payment_method.replace('_',' ')}
            </div>
          </div>
        </div>
      </div>
      <div class="inv-accent-bar"></div>

      <div class="inv-body">
        <div class="inv-boxes">
          <div class="inv-box">
            <div class="inv-box-head">BILL TO</div>
            <div class="inv-box-body">
              <div class="val">${escapeHtml(sale.customer_name || 'Walk-in Customer')}</div>
              ${sale.customer_phone ? `<div class="label">${escapeHtml(sale.customer_phone)}</div>` : ''}
            </div>
          </div>
          <div class="inv-box">
            <div class="inv-box-head">PAYMENT DETAILS</div>
            <div class="inv-box-body">
              <div class="label">Method: <span class="val">${sale.payment_method.replace('_',' ').toUpperCase()}</span></div>
              <div class="label" style="margin-top:4px;">Status: <span class="${status.cls}">${status.label}</span></div>
            </div>
          </div>
        </div>

        <table class="inv-table">
          <thead>
            <tr>
              <th>Description</th>
              <th class="num">Unit Price</th>
              <th class="num">Qty</th>
              <th class="num">Total</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(i => `
              <tr>
                <td>${escapeHtml(i.name)}</td>
                <td class="num">${i.isService ? '' : money(i.unit_price)}</td>
                <td class="num">${i.isService ? '' : i.quantity}</td>
                <td class="num">${money(i.unit_price * i.quantity)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>

        <div class="inv-stamp-wrap">
          <div class="inv-stamp ${status.cls}" style="border-color:currentColor; color:${status.cls === 'paid' ? 'var(--green)' : status.cls === 'partial' ? 'var(--gold)' : '#D64545'};">${status.label}</div>
          <div class="inv-totals">
            <div class="row"><span>Subtotal</span><span>${money(sale.subtotal)}</span></div>
            ${sale.discount > 0 ? `<div class="row"><span>Discount</span><span>-${money(sale.discount)}</span></div>` : ''}
            ${sale.is_credit ? `<div class="row"><span>Paid</span><span>${money(sale.amount_paid)}</span></div><div class="row"><span>Balance</span><span>${money(sale.balance)}</span></div>` : ''}
            <div class="row grand"><span>TOTAL</span><span>${money(sale.total)}</span></div>
          </div>
        </div>

        <div class="inv-footer">
          <p><strong>Thank you for your business!</strong></p>
        </div>
      </div>

      <div class="receipt-actions">
        <button class="btn btn-outline" style="color:var(--navy); border-color:#DDE1E7;" id="print-receipt-btn">🖨️ Print</button>
        <button class="btn btn-green" id="whatsapp-receipt-btn">📱 WhatsApp</button>
      </div>
      <div style="padding:0 32px 24px;">
        <button class="btn btn-outline" style="width:100%; justify-content:center; color:var(--navy); border-color:#DDE1E7;" onclick="document.getElementById('receipt-modal').classList.remove('open')">Close</button>
      </div>
    `;
    document.getElementById('receipt-modal').classList.add('open');

    document.getElementById('print-receipt-btn').addEventListener('click', () => window.print());

    document.getElementById('whatsapp-receipt-btn').addEventListener('click', () => {
      const text = encodeURIComponent(buildReceiptText(sale, items));
      const phone = normalizePhone(sale.customer_phone);
      const url = phone ? `https://wa.me/${phone}?text=${text}` : `https://wa.me/?text=${text}`;
      window.open(url, '_blank');
    });
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — BINet Funnel Digitals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<style>
.login-wrap{min-height:calc(100vh - 74px); display:flex; align-items:center; justify-content:center; background:var(--off-white); padding:40px 20px;}
.login-card{width:100%; max-width:400px; background:var(--white); border:1px solid #E7E9EE; border-radius:16px; padding:40px 34px;}
.login-card h1{font-size:1.5rem; margin-bottom:8px;}
.login-card p.sub{color:var(--slate); font-size:0.92rem; margin-bottom:26px;}
.login-card form{display:flex; flex-direction:column; gap:18px;}
.login-card button{width:100%; justify-content:center; padding:13px;}
#msg-box{display:none; padding:12px 14px; border-radius:8px; font-size:0.86rem; margin-bottom:16px;}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="BINet Funnel Digitals logo">
      <span>BINet Funnel Digitals</span>
    </a>
  </div>
</header>

<div class="login-wrap">
  <div class="login-card">
    <h1>Set a new password</h1>
    <p class="sub">Choose a new password for your account.</p>
    <div id="msg-box"></div>
    <form id="update-form">
      <div>
        <label for="new-password" style="font-size:0.86rem; font-weight:600; display:block; margin-bottom:6px;">New password</label>
        <input type="password" id="new-password" required minlength="6" style="width:100%; padding:12px 14px; border-radius:8px; border:1px solid #DDE1E7; background:var(--off-white);">
      </div>
      <button type="submit" class="btn btn-green" id="update-btn">Update Password</button>
    </form>
  </div>
</div>

<script>
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const form = document.getElementById('update-form');
  const msgBox = document.getElementById('msg-box');
  const btn = document.getElementById('update-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.textContent = 'Updating...';
    const newPassword = document.getElementById('new-password').value;

    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    msgBox.style.display = 'block';
    if (error) {
      msgBox.style.background = '#FCEBEB';
      msgBox.style.color = '#791F1F';
      msgBox.textContent = 'Error: ' + error.message + ' — the link may have expired, request a new one.';
      btn.textContent = 'Update Password';
    } else {
      msgBox.style.background = '#E9F7F1';
      msgBox.style.color = '#0F5D3F';
      msgBox.textContent = 'Password updated! Redirecting to login...';
      form.style.display = 'none';
      await supabaseClient.auth.signOut();
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    }
  });
</script>

</body>
</html>
